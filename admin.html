<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PassTrust Admin</title>
  <style>
    body{font-family:system-ui;background:#0f172a;color:#e5e7eb;margin:0}
    .wrap{max-width:1100px;margin:0 auto;padding:24px}
    .card{background:#111827;border:1px solid #1f2937;border-radius:16px;padding:16px;margin:12px 0}
    input,button,select{padding:10px;border-radius:10px;border:1px solid #374151;background:#0b1220;color:#e5e7eb}
    button{cursor:pointer}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .muted{color:#9ca3af;font-size:14px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>PassTrust — Dashboard admin</h1>
    <div id="authBox" class="card"></div>
    <div class="card">
      <h2>Demandes</h2>
      <div id="count" class="muted">—</div>
      <div id="leads"></div>
    </div>
  </div>

  <script type="module" src="./admin.js"></script>
</body>
</html>
