<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PassTrust — Dashboard admin</title>

  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --line: #263244;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --primary: #20b8a6;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(28px, 5vw, 44px);
    }

    h2 {
      margin-top: 0;
    }

    .panel {
      margin: 16px 0;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    input,
    select,
    button {
      min-height: 42px;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
    }

    input,
    select {
      color: var(--text);
      background: #0b1220;
    }

    input {
      width: min(360px, 100%);
    }

    button {
      color: #062c2a;
      background: var(--primary);
      border-color: var(--primary);
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      color: var(--text);
      background: transparent;
      border-color: var(--line);
    }

    .muted {
      color: var(--muted);
    }

    .error {
      color: var(--danger);
      white-space: pre-wrap;
    }

    .success {
      color: #5eead4;
    }

    .lead-card {
      margin-top: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #0b1220;
    }

    .lead-card p {
      line-height: 1.5;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      color: #042f2e;
      background: #5eead4;
      font-size: 12px;
      font-weight: 700;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>PassTrust — Dashboard admin</h1>

    <section id="auth-panel" class="panel">
      <h2>Connexion admin</h2>

      <form id="login-form">
        <div class="row">
          <input
            id="login-email"
            type="email"
            placeholder="Ton email admin"
            autocomplete="email"
            required
          >
          <button type="submit">Recevoir le lien</button>
        </div>
      </form>

      <p id="login-message" class="muted"></p>
    </section>

    <section id="dashboard-panel" class="panel hidden">
      <div class="row">
        <div>
          Connecté avec :
          <strong id="current-email"></strong>
        </div>

        <button id="logout-button" class="secondary" type="button">
          Déconnexion
        </button>
      </div>

      <hr>

      <div class="row">
        <h2 style="margin: 0;">Demandes</h2>
        <span id="lead-count" class="badge">0</span>
        <button id="refresh-button" class="secondary" type="button">
          Actualiser
        </button>
      </div>

      <p id="dashboard-message" class="muted"></p>
      <div id="leads-list"></div>
    </section>
  </main>

  <!-- SDK Supabase officiel via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Notre code : surtout pas type="module" ici -->
  <script src="./admin.js"></script>
</body>
</html>
